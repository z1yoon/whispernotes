name: Build and Push to Harbor - Staging

on:
  push:
    branches: [ staging ]
  pull_request:
    branches: [ staging ]

env:
  HARBOR_REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
  HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
  HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-service, file-uploader, video-processor, whisperx, llm-service, frontend]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Harbor Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.HARBOR_REGISTRY }}
        username: ${{ env.HARBOR_USERNAME }}
        password: ${{ env.HARBOR_PASSWORD }}
    
    - name: Set build context
      id: context
      run: |
        if [ "${{ matrix.service }}" = "frontend" ]; then
          echo "context=./services/${{ matrix.service }}" >> $GITHUB_OUTPUT
        else
          echo "context=./services" >> $GITHUB_OUTPUT
        fi
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ${{ steps.context.outputs.context }}
        file: ./services/${{ matrix.service }}/Dockerfile
        push: true
        tags: ${{ env.HARBOR_REGISTRY }}/whispernotes/${{ matrix.service }}:${{ env.IMAGE_TAG }}
        cache-from: type=registry,ref=${{ env.HARBOR_REGISTRY }}/whispernotes/cache:${{ matrix.service }}
        cache-to: type=registry,ref=${{ env.HARBOR_REGISTRY }}/whispernotes/cache:${{ matrix.service }},mode=max
        platforms: linux/amd64