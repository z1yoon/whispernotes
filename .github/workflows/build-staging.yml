name: Build and Push to DockerHub - Staging

on:
  push:
    branches: [ staging ]

env:
  DOCKERHUB_USERNAME: z1yoon
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-service, file-uploader, video-processor, whisperx, llm-service, frontend]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ env.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Build and push Docker image
      run: |
        if [ "${{ matrix.service }}" = "frontend" ]; then
          docker build \
            --target production \
            -t ${{ env.DOCKERHUB_USERNAME }}/whispernotes:${{ matrix.service }}-${{ env.IMAGE_TAG }} \
            -f ./services/frontend/Dockerfile \
            ./services/frontend
        else
          docker build \
            -t ${{ env.DOCKERHUB_USERNAME }}/whispernotes:${{ matrix.service }}-${{ env.IMAGE_TAG }} \
            -f ./services/${{ matrix.service }}/Dockerfile \
            ./services
        fi
        docker push ${{ env.DOCKERHUB_USERNAME }}/whispernotes:${{ matrix.service }}-${{ env.IMAGE_TAG }}