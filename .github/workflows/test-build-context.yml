name: Test Build Context - All Services

on:
  push:
    branches: [ staging, main ]
  pull_request:
    branches: [ staging, main ]

env:
  DOCKERHUB_USERNAME: z1yoon
  IMAGE_TAG: test-${{ github.sha }}

jobs:
  test-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-service, file-uploader, video-processor, whisperx, llm-service, frontend]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ env.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Debug - Check services directory structure
      run: |
        echo "=== Services directory structure ==="
        ls -la ./services/
        echo ""
        echo "=== Current service: ${{ matrix.service }} ==="
        ls -la ./services/${{ matrix.service }}/
        echo ""
        echo "=== Checking shared_utils.py ==="
        ls -la ./services/shared_utils.py || echo "❌ shared_utils.py missing"
    
    - name: Test build with consistent context
      run: |
        # Use same context path for all services
        echo "Building ${{ matrix.service }}..."
        docker build \
          -t ${{ env.DOCKERHUB_USERNAME }}/whispernotes:${{ matrix.service }}-${{ env.IMAGE_TAG }} \
          -f ./services/${{ matrix.service }}/Dockerfile \
          ./services
        
        echo "✅ Build successful for ${{ matrix.service }}"
    
    - name: Test image and push
      run: |
        # Test that the image was built correctly
        docker images | grep ${{ matrix.service }}-${{ env.IMAGE_TAG }}
        
        # Push to DockerHub for verification
        docker push ${{ env.DOCKERHUB_USERNAME }}/whispernotes:${{ matrix.service }}-${{ env.IMAGE_TAG }}
        
        echo "✅ Image pushed successfully: ${{ env.DOCKERHUB_USERNAME }}/whispernotes:${{ matrix.service }}-${{ env.IMAGE_TAG }}"
    
    - name: Build summary
      run: |
        echo "🎯 Build Context Test Summary for ${{ matrix.service }}:"
        echo "   Context Path: ./services"
        echo "   Dockerfile: ./services/${{ matrix.service }}/Dockerfile"
        echo "   Status: ✅ SUCCESS"
        echo ""
        echo "This confirms the consistent context path works for all services!"