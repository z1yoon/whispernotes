name: Test Build Context - All Services

on:
  push:
    branches: [ staging, main ]
  pull_request:
    branches: [ staging, main ]

env:
  DOCKERHUB_USERNAME: z1yoon
  IMAGE_TAG: test-${{ github.sha }}

jobs:
  test-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-service, file-uploader, video-processor, whisperx, llm-service, frontend]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ env.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Debug - Check services directory structure
      run: |
        echo "=== Services directory structure ==="
        ls -la ./services/
        echo ""
        echo "=== Current service: ${{ matrix.service }} ==="
        ls -la ./services/${{ matrix.service }}/
        echo ""
        echo "=== Checking shared_utils.py (for Python services) ==="
        if [ -f "./services/shared_utils.py" ]; then
          echo "✅ shared_utils.py exists"
        else
          echo "❌ shared_utils.py missing"
        fi
        echo ""
        echo "=== Checking service-specific files ==="
        if [ "${{ matrix.service }}" = "frontend" ]; then
          echo "Frontend specific files:"
          ls -la ./services/frontend/package.json || echo "❌ package.json missing"
          ls -la ./services/frontend/src/lib/ || echo "❌ src/lib directory missing"
        else
          echo "Python service specific files:"
          ls -la ./services/${{ matrix.service }}/requirements.txt || echo "❌ requirements.txt missing"
          ls -la ./services/${{ matrix.service }}/main.py || echo "❌ main.py missing"
        fi
    
    - name: Test build with consistent context and target
      run: |
        # Use same context path and target as GitLab CI for all services
        echo "Building ${{ matrix.service }} with target=production..."
        docker build \
          --target production \
          -t ${{ env.DOCKERHUB_USERNAME }}/whispernotes:${{ matrix.service }}-${{ env.IMAGE_TAG }} \
          -f ./services/${{ matrix.service }}/Dockerfile \
          ./services
        
        echo "✅ Build successful for ${{ matrix.service }}"
    
    - name: Test image and push (optional)
      if: github.event_name == 'push'
      run: |
        # Test that the image was built correctly
        docker images | grep ${{ matrix.service }}-${{ env.IMAGE_TAG }}
        
        # Push to DockerHub for verification
        docker push ${{ env.DOCKERHUB_USERNAME }}/whispernotes:${{ matrix.service }}-${{ env.IMAGE_TAG }}
        
        echo "✅ Image pushed successfully: ${{ env.DOCKERHUB_USERNAME }}/whispernotes:${{ matrix.service }}-${{ env.IMAGE_TAG }}"
    
    - name: Build summary
      run: |
        echo "🎯 Build Context Test Summary for ${{ matrix.service }}:"
        echo "   Context Path: ./services"
        echo "   Dockerfile: ./services/${{ matrix.service }}/Dockerfile"
        echo "   Target: production"
        echo "   Status: ✅ SUCCESS"
        echo ""
        echo "This confirms the consistent context path and target works for all services!"