stages:
  - test-auth
  - build

# Test Harbor authentication
test-harbor-auth:
  stage: test-auth
  image: curlimages/curl:latest
  script:
    - |
      echo "Testing Harbor registry connectivity..."
      echo "Registry: $HARBOR_REGISTRY"
      echo "Username: $HARBOR_USERNAME"
      
      # Test Harbor API access
      echo "Testing Harbor API..."
      curl -f -u "$HARBOR_USERNAME:$HARBOR_PASSWORD" \
        "https://$HARBOR_REGISTRY/api/v2.0/projects" || {
        echo "ERROR: Harbor API authentication failed"
        exit 1
      }
      
      # Test Docker registry login
      echo "Testing Docker registry login..."
      echo "$HARBOR_PASSWORD" | docker login "$HARBOR_REGISTRY" \
        -u "$HARBOR_USERNAME" --password-stdin || {
        echo "ERROR: Docker registry login failed"
        exit 1
      }
      
      echo "✅ Harbor authentication successful!"
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"

# Simple Kaniko test - build one service only
test-kaniko-build:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.9.0-debug
    entrypoint: [""]
  before_script:
    - |
      echo "Setting up Kaniko authentication..."
      mkdir -p /kaniko/.docker
      
      # Simple auth setup
      echo "{\"auths\":{\"$HARBOR_REGISTRY\":{\"username\":\"$HARBOR_USERNAME\",\"password\":\"$HARBOR_PASSWORD\"}}}" > /kaniko/.docker/config.json
      
      echo "Auth config created, testing registry access..."
  script:
    - |
      echo "Building auth-service with Kaniko..."
      /kaniko/executor \
        --context $CI_PROJECT_DIR/services/auth-service \
        --dockerfile $CI_PROJECT_DIR/services/auth-service/Dockerfile \
        --destination $HARBOR_REGISTRY/whispernotes/auth-service:test-$CI_COMMIT_SHA \
        --verbosity=debug \
        --log-timestamp
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"