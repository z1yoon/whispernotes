stages:
  - build
  - deploy

variables:
  DOCKER_DRIVER: overlay2

# Simple BuildKit template without rootless complications
.buildkit_template: &buildkit_template
  image: moby/buildkit:latest
  stage: build
  before_script:
    - |
      mkdir -p ~/.docker
      echo "{\"auths\":{\"$HARBOR_REGISTRY\":{\"username\":\"$HARBOR_USERNAME\",\"password\":\"$HARBOR_PASSWORD\"}}}" > ~/.docker/config.json
  script:
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=services/$SERVICE_NAME \
        --local dockerfile=services/$SERVICE_NAME \
        --output type=image,name=$HARBOR_REGISTRY/whispernotes/$SERVICE_NAME:$CI_COMMIT_SHA,push=true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# Build jobs
build:auth-service:
  <<: *buildkit_template
  variables:
    SERVICE_NAME: auth-service

build:file-uploader:
  <<: *buildkit_template
  variables:
    SERVICE_NAME: file-uploader

build:video-processor:
  <<: *buildkit_template
  variables:
    SERVICE_NAME: video-processor

build:whisperx:
  <<: *buildkit_template
  variables:
    SERVICE_NAME: whisperx

build:llm-service:
  <<: *buildkit_template
  variables:
    SERVICE_NAME: llm-service

build:frontend:
  <<: *buildkit_template
  variables:
    SERVICE_NAME: frontend

# Deploy job
deploy:microk8s:
  stage: deploy
  image: alpine/helm:3.12.0
  variables:
    KUBE_NAMESPACE: whispernotes
  before_script:
    - mkdir -p ~/.kube
    - echo "$MICROK8S_KUBECONFIG_CONTENT" | base64 -d > ~/.kube/config
  script:
    - |
      helm upgrade --install whispernotes ./helm \
        --namespace $KUBE_NAMESPACE \
        --create-namespace \
        --set global.imageRegistry=$HARBOR_REGISTRY/whispernotes \
        --set services.whisperx.image=whisperx:$CI_COMMIT_SHA \
        --set services.llmService.image=llm-service:$CI_COMMIT_SHA \
        --set services.fileUploader.image=file-uploader:$CI_COMMIT_SHA \
        --set services.authService.image=auth-service:$CI_COMMIT_SHA \
        --set services.videoProcessor.image=video-processor:$CI_COMMIT_SHA \
        --set services.frontend.image=frontend:$CI_COMMIT_SHA \
        --wait
  environment:
    name: main
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  when: manual