stages:
  - test
  - build
  - deploy

# Test template with BuildKit daemon
.test_template: &test_template
  stage: test
  image: moby/buildkit:latest
  services:
    - name: moby/buildkit:buildkitd-rootless
      alias: buildkitd
      command: ["--addr", "tcp://0.0.0.0:1234", "--oci-worker-no-process-sandbox"]
  variables:
    BUILDKIT_HOST: tcp://buildkitd:1234
  before_script:
    - apk add --no-cache docker-cli
    - docker login -u $HARBOR_USERNAME -p $HARBOR_PASSWORD $HARBOR_REGISTRY
    # Test BuildKit connectivity
    - docker buildx create --driver remote --name container --use tcp://buildkitd:1234
    - docker buildx inspect --bootstrap
  script:
    - cd services/$SERVICE_NAME
    - docker buildx build --target test -t $SERVICE_NAME:test-$CI_COMMIT_SHA . --load
    - docker run --rm $SERVICE_NAME:test-$CI_COMMIT_SHA
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"

# Build template with BuildKit daemon
.build_template: &build_template
  stage: build
  image: moby/buildkit:latest
  services:
    - name: moby/buildkit:buildkitd-rootless
      alias: buildkitd
      command: ["--addr", "tcp://0.0.0.0:1234", "--oci-worker-no-process-sandbox"]
  variables:
    BUILDKIT_HOST: tcp://buildkitd:1234
  before_script:
    - apk add --no-cache docker-cli
    - docker login -u $HARBOR_USERNAME -p $HARBOR_PASSWORD $HARBOR_REGISTRY
    # Test BuildKit connectivity
    - docker buildx create --driver remote --name container --use tcp://buildkitd:1234
    - docker buildx inspect --bootstrap
  script:
    - cd services/$SERVICE_NAME
    - docker buildx build -t $HARBOR_REGISTRY/whispernotes/$SERVICE_NAME:$CI_COMMIT_SHA . --push
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# Test all services on staging
test:auth-service:
  <<: *test_template
  variables:
    SERVICE_NAME: auth-service

test:file-uploader:
  <<: *test_template
  variables:
    SERVICE_NAME: file-uploader

test:video-processor:
  <<: *test_template
  variables:
    SERVICE_NAME: video-processor

test:whisperx:
  <<: *test_template
  variables:
    SERVICE_NAME: whisperx

test:llm-service:
  <<: *test_template
  variables:
    SERVICE_NAME: llm-service

test:frontend:
  <<: *test_template
  variables:
    SERVICE_NAME: frontend

# Build all services with DinD
build:auth-service:
  <<: *build_template
  variables:
    SERVICE_NAME: auth-service

build:file-uploader:
  <<: *build_template
  variables:
    SERVICE_NAME: file-uploader

build:video-processor:
  <<: *build_template
  variables:
    SERVICE_NAME: video-processor

build:whisperx:
  <<: *build_template
  variables:
    SERVICE_NAME: whisperx

build:llm-service:
  <<: *build_template
  variables:
    SERVICE_NAME: llm-service

build:frontend:
  <<: *build_template
  variables:
    SERVICE_NAME: frontend

deploy:microk8s:
  stage: deploy
  image: alpine/helm:3.12.0
  variables:
    KUBE_NAMESPACE: whispernotes
  before_script:
    - mkdir -p ~/.kube
    - echo "$MICROK8S_KUBECONFIG_CONTENT" | base64 -d > ~/.kube/config
  script:
    - |
      helm upgrade --install whispernotes ./helm \
        --namespace $KUBE_NAMESPACE \
        --create-namespace \
        --set global.imageRegistry=$HARBOR_REGISTRY/whispernotes \
        --set services.whisperx.image=whisperx:$CI_COMMIT_SHA \
        --set services.llmService.image=llm-service:$CI_COMMIT_SHA \
        --set services.fileUploader.image=file-uploader:$CI_COMMIT_SHA \
        --set services.frontend.image=frontend:$CI_COMMIT_SHA \
        --wait
  environment:
    name: main
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  when: manual