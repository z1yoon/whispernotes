stages:
  - test
  - build
  - deploy

# Test template with BuildKit (no Docker daemon)
.test_template: &test_template
  stage: test
  image: moby/buildkit:latest
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox --oci-worker-snapshotter=overlayfs --addr tcp://0.0.0.0:1234
    BUILDKIT_HOST: tcp://127.0.0.1:1234
  before_script:
    - mkdir -p ~/.docker
    - echo "{\"auths\":{\"$HARBOR_REGISTRY\":{\"username\":\"$HARBOR_USERNAME\",\"password\":\"$HARBOR_PASSWORD\"}}}" > ~/.docker/config.json
    # Start BuildKit daemon in background with overlayfs snapshotter
    - buildkitd $BUILDKITD_FLAGS &
    - sleep 5
    # Test connection
    - buildctl debug workers
  script:
    - cd services/$SERVICE_NAME
    # Build and run tests using BuildKit directly
    - |
      buildctl build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=. \
        --opt target=test \
        --opt build-arg:RUN_TESTS=true
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"

# Build template with BuildKit (no Docker daemon)
.build_template: &build_template
  stage: build
  image: moby/buildkit:latest
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox --oci-worker-snapshotter=overlayfs --addr tcp://0.0.0.0:1234
    BUILDKIT_HOST: tcp://127.0.0.1:1234
  before_script:
    - mkdir -p ~/.docker
    - echo "{\"auths\":{\"$HARBOR_REGISTRY\":{\"username\":\"$HARBOR_USERNAME\",\"password\":\"$HARBOR_PASSWORD\"}}}" > ~/.docker/config.json
    # Start BuildKit daemon in background with overlayfs snapshotter
    - buildkitd $BUILDKITD_FLAGS &
    - sleep 5
    # Test connection
    - buildctl debug workers
  script:
    - cd services/$SERVICE_NAME
    - |
      buildctl build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=. \
        --output type=image,name=$HARBOR_REGISTRY/whispernotes/$SERVICE_NAME:$CI_COMMIT_SHA,push=true \
        --export-cache type=registry,ref=$HARBOR_REGISTRY/whispernotes/$SERVICE_NAME:cache \
        --import-cache type=registry,ref=$HARBOR_REGISTRY/whispernotes/$SERVICE_NAME:cache
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# Test all services on staging
test:auth-service:
  <<: *test_template
  variables:
    SERVICE_NAME: auth-service

test:file-uploader:
  <<: *test_template
  variables:
    SERVICE_NAME: file-uploader

test:video-processor:
  <<: *test_template
  variables:
    SERVICE_NAME: video-processor

test:whisperx:
  <<: *test_template
  variables:
    SERVICE_NAME: whisperx

test:llm-service:
  <<: *test_template
  variables:
    SERVICE_NAME: llm-service

test:frontend:
  <<: *test_template
  variables:
    SERVICE_NAME: frontend

# Build all services with DinD
build:auth-service:
  <<: *build_template
  variables:
    SERVICE_NAME: auth-service

build:file-uploader:
  <<: *build_template
  variables:
    SERVICE_NAME: file-uploader

build:video-processor:
  <<: *build_template
  variables:
    SERVICE_NAME: video-processor

build:whisperx:
  <<: *build_template
  variables:
    SERVICE_NAME: whisperx

build:llm-service:
  <<: *build_template
  variables:
    SERVICE_NAME: llm-service

build:frontend:
  <<: *build_template
  variables:
    SERVICE_NAME: frontend

deploy:microk8s:
  stage: deploy
  image: alpine/helm:3.12.0
  variables:
    KUBE_NAMESPACE: whispernotes
  before_script:
    - mkdir -p ~/.kube
    - echo "$MICROK8S_KUBECONFIG_CONTENT" | base64 -d > ~/.kube/config
  script:
    - |
      helm upgrade --install whispernotes ./helm \
        --namespace $KUBE_NAMESPACE \
        --create-namespace \
        --set global.imageRegistry=$HARBOR_REGISTRY/whispernotes \
        --set services.whisperx.image=whisperx:$CI_COMMIT_SHA \
        --set services.llmService.image=llm-service:$CI_COMMIT_SHA \
        --set services.fileUploader.image=file-uploader:$CI_COMMIT_SHA \
        --set services.frontend.image=frontend:$CI_COMMIT_SHA \
        --wait
  environment:
    name: main
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  when: manual