# GitLab CI/CD for On-Premise WhisperNotes Deployment
# - Build: Both staging and main branches build container images with Kaniko
# - Deploy: Only main branch deploys to production MicroK8s cluster (manual trigger)
# - Harbor Registry: On-premise container registry with security scanning

stages:
  - build
  - deploy

variables:
  # Use commit SHA for image tags
  IMAGE_TAG: $CI_COMMIT_SHA

# Kaniko template for building container images
.kaniko_template: &kaniko_template
  image:
    name: gcr.io/kaniko-project/executor:v1.9.0-debug
    entrypoint: [""]
  stage: build
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$HARBOR_REGISTRY\":{\"username\":\"$HARBOR_USERNAME\",\"password\":\"$HARBOR_PASSWORD\"}}}" > /kaniko/.docker/config.json
  script:
    - |
      /kaniko/executor \
        --context $CI_PROJECT_DIR/services \
        --dockerfile $CI_PROJECT_DIR/services/$SERVICE_NAME/Dockerfile \
        --destination $HARBOR_REGISTRY/whispernotes/$SERVICE_NAME:$IMAGE_TAG \
        --use-new-run \
        --cleanup
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# Build all services
build:auth-service:
  <<: *kaniko_template
  variables:
    SERVICE_NAME: auth-service

build:file-uploader:
  <<: *kaniko_template
  variables:
    SERVICE_NAME: file-uploader

build:video-processor:
  <<: *kaniko_template
  variables:
    SERVICE_NAME: video-processor

build:whisperx:
  <<: *kaniko_template
  variables:
    SERVICE_NAME: whisperx

build:llm-service:
  <<: *kaniko_template
  variables:
    SERVICE_NAME: llm-service

build:frontend:
  <<: *kaniko_template
  variables:
    SERVICE_NAME: frontend


# Deploy to MicroK8s - Main branch only (Production)
deploy:microk8s:
  stage: deploy
  image: harbor.leeseng.net/whispernotes/ci-base:latest
  variables:
    KUBE_NAMESPACE: whispernotes
  before_script:
    # All tools (kubectl, gettext, curl, bash) are pre-installed in ci-base image
    - mkdir -p ~/.kube
    - echo "$MICROK8S_KUBECONFIG_CONTENT" | base64 -d > ~/.kube/config
  script:
    - |
      echo "Deploying to production MicroK8s cluster..."
      envsubst < ./helm/ci-secrets.yaml > /tmp/secrets.yaml
      kubectl apply -f /tmp/secrets.yaml
      
      helm upgrade --install whispernotes ./helm \
        --namespace $KUBE_NAMESPACE \
        --create-namespace \
        --set global.imageRegistry=$HARBOR_REGISTRY/whispernotes \
        --set services.authService.image=auth-service:$IMAGE_TAG \
        --set services.fileUploader.image=file-uploader:$IMAGE_TAG \
        --set services.videoProcessor.image=video-processor:$IMAGE_TAG \
        --set services.whisperx.image=whisperx:$IMAGE_TAG \
        --set services.llmService.image=llm-service:$IMAGE_TAG \
        --set services.frontend.image=frontend:$IMAGE_TAG \
        --wait \
        --timeout=10m
      echo "Deployment completed successfully"
  environment:
    name: production
    url: https://whispernotes.leeseng.net
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

