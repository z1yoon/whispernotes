stages:
  - build

# BuildKit template - using cluster BuildKit service
.buildkit_template: &buildkit_template
  image: moby/buildkit:v0.12.0
  stage: build
  variables:
    BUILDKIT_HOST: tcp://buildkitd.buildkit.svc.cluster.local:1234
  before_script:
    - mkdir -p ~/.docker
    - echo "{\"auths\":{\"$HARBOR_REGISTRY\":{\"username\":\"$HARBOR_USERNAME\",\"password\":\"$HARBOR_PASSWORD\"}}}" > ~/.docker/config.json
  script:
    - |
      buildctl \
        --addr $BUILDKIT_HOST \
        build \
        --frontend dockerfile.v0 \
        --local context=services/$SERVICE_NAME \
        --local dockerfile=services/$SERVICE_NAME \
        --output type=image,name=$HARBOR_REGISTRY/whispernotes/$SERVICE_NAME:test-$CI_COMMIT_SHA,push=true
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"

# Build jobs (testing BuildKit cluster service)
build:auth-service:
  <<: *buildkit_template
  variables:
    SERVICE_NAME: auth-service

build:file-uploader:
  <<: *buildkit_template
  variables:
    SERVICE_NAME: file-uploader

build:frontend:
  <<: *buildkit_template
  variables:
    SERVICE_NAME: frontend