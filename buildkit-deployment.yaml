apiVersion: v1
kind: Namespace
metadata:
  name: buildkit
  labels:
    name: buildkit
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildkitd
  namespace: buildkit
  labels:
    app: buildkitd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: buildkitd
  template:
    metadata:
      labels:
        app: buildkitd
    spec:
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
      containers:
      - name: buildkitd
        image: moby/buildkit:v0.12.0
        args:
        - --addr
        - tcp://0.0.0.0:1234
        - --oci-worker-no-process-sandbox
        - --allow-insecure-entitlement
        - security.insecure
        ports:
        - containerPort: 1234
          name: buildkit
        securityContext:
          privileged: true
        env:
        - name: BUILDKITD_FLAGS
          value: "--oci-worker-no-process-sandbox"
        volumeMounts:
        - name: buildkit-socket
          mountPath: /run/buildkit
        - name: var-lib-buildkit
          mountPath: /var/lib/buildkit
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            memory: 512Mi
            cpu: 500m
          limits:
            memory: 2Gi
            cpu: 2000m
        readinessProbe:
          exec:
            command:
            - buildctl
            - debug
            - workers
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 10
        livenessProbe:
          exec:
            command:
            - buildctl
            - debug
            - workers
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
      volumes:
      - name: buildkit-socket
        emptyDir: {}
      - name: var-lib-buildkit
        emptyDir: {}
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: buildkitd
  namespace: buildkit
  labels:
    app: buildkitd
spec:
  selector:
    app: buildkitd
  ports:
  - port: 1234
    targetPort: 1234
    name: buildkit
  type: ClusterIP
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: buildkit-runner
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "create", "delete"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: buildkit-runner
  namespace: buildkit
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: buildkit-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: buildkit-runner
subjects:
- kind: ServiceAccount
  name: buildkit-runner
  namespace: buildkit