apiVersion: batch/v1
kind: Job
metadata:
  name: whispernotes-cleanup-manual
  namespace: whispernotes
  labels:
    app: whispernotes
    component: cleanup
spec:
  ttlSecondsAfterFinished: 600  # Keep job visible for 10 minutes
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: whispernotes
        component: cleanup
    spec:
      restartPolicy: Never
      containers:
      - name: cleanup
        image: minio/mc:RELEASE.2024-07-08T20-59-24Z
        command: ["/bin/sh"]
        args:
          - -c
          - |
            echo "🧹 CLEANING STUCK WHISPER-NOTES SESSIONS"
            echo "⚠️  Cleaning stuck sessions older than 2 hours"
            echo ""
            
            # Install required tools
            apk add --no-cache redis postgresql-client
            
            # Clean stuck Redis sessions
            echo "🔥 Cleaning Redis stuck sessions..."
            redis-cli -h ${REDIS_HOST} -p ${REDIS_PORT} -a ${REDIS_PASSWORD} --scan --pattern "progress:*" | \
              xargs -I {} redis-cli -h ${REDIS_HOST} -p ${REDIS_PORT} -a ${REDIS_PASSWORD} --eval - {} << 'EOF'
            local key = KEYS[1]
            local ttl = redis.call('TTL', key)
            if ttl == -1 then
              redis.call('DEL', key)
              return "DELETED: " .. key
            end
            return "SKIPPED: " .. key
            EOF
            echo "✅ Redis stuck sessions cleaned"
            echo ""
            
            # Clean stuck PostgreSQL sessions
            echo "🔥 Cleaning PostgreSQL stuck sessions..."
            PGPASSWORD="${POSTGRES_PASSWORD}" psql \
              -h ${POSTGRES_HOST} \
              -p ${POSTGRES_PORT} \
              -U ${POSTGRES_USER} \
              -d ${POSTGRES_DB} \
              -c "
                DELETE FROM sessions WHERE status IN ('uploading', 'processing', 'transcribing') 
                  AND created_at < NOW() - INTERVAL '2 hours';
                VACUUM ANALYZE sessions;
              " && echo "✅ PostgreSQL cleaned" || echo "⚠️ PostgreSQL cleanup failed"
            echo ""
            
            echo "📊 CLEANUP SUMMARY:"
            echo "=================="
            echo "Redis keys remaining: $(redis-cli -h ${REDIS_HOST} -p ${REDIS_PORT} -a ${REDIS_PASSWORD} DBSIZE)"
            echo ""
            echo "🎉 CLEANUP COMPLETED SUCCESSFULLY!"
            echo "🚀 System is ready for new uploads"
            
        envFrom:
        - configMapRef:
            name: whispernotes-config
        - secretRef:
            name: whispernotes-secrets
        
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
              - ALL