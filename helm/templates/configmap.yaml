apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "whispernotes.configMapName" . }}
  namespace: whispernotes
  labels:
    {{- include "whispernotes.labels" . | nindent 4 }}
data:
  # Database
  POSTGRES_DB: "whisper_notes"
  POSTGRES_USER: "whisper_user"
  POSTGRES_HOST: whispernotes-postgres.whispernotes.svc.cluster.local
  POSTGRES_PORT: "5432"
  
  # Redis
  REDIS_HOST: whispernotes-redis.whispernotes.svc.cluster.local
  REDIS_PORT: "6379"
  
  # RabbitMQ
  RABBITMQ_HOST: whispernotes-rabbitmq.whispernotes.svc.cluster.local
  RABBITMQ_PORT: "5672"
  RABBITMQ_DEFAULT_USER: "whisper_user"
  RABBITMQ_DEFAULT_VHOST: "/"
  
  # MinIO Configuration
  MINIO_ENDPOINT: "minio.minio.svc.cluster.local:9000"  # Internal services use direct connection
  MINIO_ACCESS_KEY: "admin"
  MINIO_BUCKET: "whispernotes"
  
  # Internal Services (Kubernetes service names with proper FQDN)
  FILE_UPLOADER_URL: http://whispernotes-file-uploader.whispernotes.svc.cluster.local:8002
  WHISPER_SERVICE_URL: http://whispernotes-whisperx.whispernotes.svc.cluster.local:8003
  LLM_SERVICE_URL: http://whispernotes-llm-service.whispernotes.svc.cluster.local:8004
  VIDEO_PROCESSOR_URL: http://whispernotes-video-processor.whispernotes.svc.cluster.local:8001
  
  # LLM Configuration
  QWEN_API_BASE: "https://test-llm.rdc.nie.edu.sg/api/v1/"
  QWEN_MODEL: "DeepSeek-R1-Distill-Qwen-32B"
  # Note: QWEN_API_KEY should be provided via secrets
  
  # WhisperX Configuration optimized for RTX 5090
  DEVICE: "cuda"
  COMPUTE_TYPE: "float16"
  BATCH_SIZE: "16"
  DEFAULT_LANGUAGE: "en"
  MIN_SPEAKERS: "1"
  MAX_SPEAKERS: "10"
  SHOULD_MOCK_DIARIZATION: "false"
  
  # Hugging Face Configuration
  HF_HOME: "/home/whisperx/.cache/huggingface"
  HF_HUB_CACHE: "/home/whisperx/.cache/huggingface/hub"
  TRANSFORMERS_CACHE: "/home/whisperx/.cache/huggingface/transformers"
  HF_HUB_DOWNLOAD_TIMEOUT: "300"
  UI_SERVICE_URL: http://whispernotes-frontend.whispernotes.svc.cluster.local:3000
  
  # Auth Service Configuration
  JWT_ALGORITHM: "HS256"
  JWT_EXPIRE_MINUTES: "30"
  ADMIN_EMAIL: "jiyoon.kim@nie.edu.sg"
  ADMIN_USERNAME: "Amber"
  
  # File Uploader Configuration  
  EXTERNAL_MINIO_HOST: "minio.leeseng.net"  # For presigned URLs that browsers can access
  # Service Ports
  VIDEO_PROCESSOR_PORT: "8001"
  
  # Environment
  ENVIRONMENT: "main"
  LOG_LEVEL: "INFO"
  NODE_ENV: "production"
  
  # Frontend (client-side environment variables)
  NEXT_PUBLIC_API_BASE_URL: "https://whispernotes.leeseng.net"
  NEXT_PUBLIC_AUTH_SERVICE_URL: "https://whispernotes.leeseng.net/api/auth"
  NEXT_PUBLIC_FILE_UPLOADER_URL: "https://whispernotes.leeseng.net/api/upload"
  NEXT_PUBLIC_VIDEO_PROCESSOR_URL: "https://whispernotes.leeseng.net/api/process"
  
  # NextAuth configuration
  NEXTAUTH_URL: "https://whispernotes.leeseng.net"
  AUTH_SERVICE_URL: http://whispernotes-auth-service.whispernotes.svc.cluster.local:8000