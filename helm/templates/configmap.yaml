apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "whispernotes.fullname" . }}-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "whispernotes.labels" . | nindent 4 }}
data:
  # Database
  POSTGRES_DB: {{ .Values.config.database.name | quote }}
  POSTGRES_USER: {{ .Values.config.database.user | quote }}
  
  # Redis
  REDIS_HOST: {{ include "whispernotes.fullname" . }}-redis
  REDIS_PORT: {{ .Values.config.redis.port | quote }}
  
  # RabbitMQ
  RABBITMQ_HOST: {{ include "whispernotes.fullname" . }}-rabbitmq
  RABBITMQ_PORT: {{ .Values.config.rabbitmq.port | quote }}
  RABBITMQ_DEFAULT_USER: {{ .Values.config.rabbitmq.user | quote }}
  RABBITMQ_DEFAULT_VHOST: {{ .Values.config.rabbitmq.vhost | quote }}
  
  # MinIO
  MINIO_ENDPOINT: {{ include "whispernotes.fullname" . }}-minio:{{ .Values.ports.minio }}
  MINIO_ACCESS_KEY: {{ .Values.config.minio.accessKey | quote }}
  
  # Services
  AUTH_SERVICE_URL: http://{{ include "whispernotes.fullname" . }}-auth-service:{{ .Values.ports.authService }}
  FILE_UPLOADER_URL: http://{{ include "whispernotes.fullname" . }}-file-uploader:{{ .Values.ports.fileUploader }}
  WHISPER_TRANSCRIBER_URL: http://{{ include "whispernotes.fullname" . }}-whisperx:{{ .Values.ports.whisperx }}
  LLM_SERVICE_URL: http://{{ include "whispernotes.fullname" . }}-llm-service:{{ .Values.ports.llmService }}
  VIDEO_PROCESSOR_URL: http://{{ include "whispernotes.fullname" . }}-video-processor:{{ .Values.ports.videoProcessor }}
  
  # LLM Configuration
  QWEN_API_BASE: {{ .Values.config.qwen.apiBase | quote }}
  QWEN_MODEL: {{ .Values.config.qwen.model | quote }}
  
  # Environment
  ENVIRONMENT: {{ .Values.global.environment | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}