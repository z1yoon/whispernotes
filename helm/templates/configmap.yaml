apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "whispernotes.fullname" . }}-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "whispernotes.labels" . | nindent 4 }}
data:
  # Database
  POSTGRES_DB: {{ .Values.config.database.name | quote }}
  POSTGRES_USER: {{ .Values.config.database.user | quote }}
  POSTGRES_HOST: {{ include "whispernotes.fullname" . }}-postgres.{{ .Values.global.namespace }}.svc.cluster.local
  POSTGRES_PORT: {{ .Values.ports.postgres | quote }}
  DATABASE_URL: postgresql://{{ .Values.config.database.user }}:${POSTGRES_PASSWORD}@{{ include "whispernotes.fullname" . }}-postgres.{{ .Values.global.namespace }}.svc.cluster.local:{{ .Values.ports.postgres }}/{{ .Values.config.database.name }}
  
  # Redis
  REDIS_HOST: {{ include "whispernotes.fullname" . }}-redis.{{ .Values.global.namespace }}.svc.cluster.local
  REDIS_PORT: {{ .Values.config.redis.port | quote }}
  REDIS_URL: redis://:${REDIS_PASSWORD}@{{ include "whispernotes.fullname" . }}-redis.{{ .Values.global.namespace }}.svc.cluster.local:{{ .Values.config.redis.port }}/0
  
  # RabbitMQ
  RABBITMQ_HOST: {{ include "whispernotes.fullname" . }}-rabbitmq.{{ .Values.global.namespace }}.svc.cluster.local
  RABBITMQ_PORT: {{ .Values.config.rabbitmq.port | quote }}
  RABBITMQ_DEFAULT_USER: {{ .Values.config.rabbitmq.user | quote }}
  RABBITMQ_DEFAULT_VHOST: {{ .Values.config.rabbitmq.vhost | quote }}
  
  # MinIO (External - existing MinIO in minio namespace)
  MINIO_ENDPOINT: {{ .Values.config.minio.host }}:{{ .Values.config.minio.port }}
  MINIO_ACCESS_KEY: {{ .Values.config.minio.accessKey | quote }}
  MINIO_BUCKET: {{ .Values.config.minio.bucket | quote }}
  
  # Internal Services (Kubernetes service names with proper FQDN)
  FILE_UPLOADER_URL: http://{{ include "whispernotes.fullname" . }}-file-uploader.{{ .Values.global.namespace }}.svc.cluster.local:{{ .Values.ports.fileUploader }}
  WHISPER_SERVICE_URL: http://{{ include "whispernotes.fullname" . }}-whisperx.{{ .Values.global.namespace }}.svc.cluster.local:{{ .Values.ports.whisperx }}
  LLM_SERVICE_URL: http://{{ include "whispernotes.fullname" . }}-llm-service.{{ .Values.global.namespace }}.svc.cluster.local:{{ .Values.ports.llmService }}
  VIDEO_PROCESSOR_URL: http://{{ include "whispernotes.fullname" . }}-video-processor.{{ .Values.global.namespace }}.svc.cluster.local:{{ .Values.ports.videoProcessor }}
  
  # LLM Configuration
  QWEN_API_BASE: {{ .Values.config.qwen.apiBase | quote }}
  QWEN_MODEL: {{ .Values.config.qwen.model | quote }}
  # Note: QWEN_API_KEY should be provided via secrets
  
  # WhisperX Configuration
  DEVICE: {{ .Values.services.whisperx.env.device | quote }}
  COMPUTE_TYPE: {{ .Values.services.whisperx.env.computeType | quote }}
  BATCH_SIZE: {{ .Values.services.whisperx.env.batchSize | quote }}
  DEFAULT_LANGUAGE: {{ .Values.config.whisperx.defaultLanguage | quote }}
  MIN_SPEAKERS: {{ .Values.config.whisperx.minSpeakers | quote }}
  MAX_SPEAKERS: {{ .Values.config.whisperx.maxSpeakers | quote }}
  UI_SERVICE_URL: http://{{ include "whispernotes.fullname" . }}-frontend.{{ .Values.global.namespace }}.svc.cluster.local:{{ .Values.ports.frontend }}
  
  # Auth Service Configuration
  JWT_ALGORITHM: {{ .Values.config.auth.jwtAlgorithm | quote }}
  JWT_EXPIRE_MINUTES: {{ .Values.config.auth.jwtExpireMinutes | quote }}
  ADMIN_EMAIL: {{ .Values.config.auth.adminEmail | quote }}
  ADMIN_USERNAME: {{ .Values.config.auth.adminUsername | quote }}
  
  # File Uploader Configuration
  EXTERNAL_MINIO_HOST: {{ .Values.config.minio.externalHost | quote }}
  # Service Ports
  VIDEO_PROCESSOR_PORT: {{ .Values.ports.videoProcessor | quote }}
  
  # Environment
  ENVIRONMENT: {{ .Values.global.environment | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  
  # Frontend (client-side environment variables)
  NEXT_PUBLIC_API_BASE_URL: https://{{ .Values.ingress.host }}
  NEXT_PUBLIC_AUTH_SERVICE_URL: https://{{ .Values.ingress.host }}/api/auth
  NEXT_PUBLIC_FILE_UPLOADER_URL: https://{{ .Values.ingress.host }}/api/upload
  NEXT_PUBLIC_VIDEO_PROCESSOR_URL: https://{{ .Values.ingress.host }}/api/process
  
  # NextAuth configuration
  NEXTAUTH_URL: https://{{ .Values.ingress.host }}
  AUTH_SERVICE_URL: http://{{ include "whispernotes.fullname" . }}-auth-service.{{ .Values.global.namespace }}.svc.cluster.local:{{ .Values.ports.authService }}