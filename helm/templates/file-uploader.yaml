{{- if .Values.services.fileUploader.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "whispernotes.fullname" . }}-file-uploader
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "whispernotes.labels" . | nindent 4 }}
    app.kubernetes.io/component: file-uploader
spec:
  replicas: {{ .Values.services.fileUploader.replicas }}
  selector:
    matchLabels:
      {{- include "whispernotes.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: file-uploader
  template:
    metadata:
      labels:
        {{- include "whispernotes.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: file-uploader
    spec:
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      containers:
      - name: file-uploader
        image: {{ .Values.global.imageRegistry }}/{{ .Values.services.fileUploader.image }}
        ports:
        - containerPort: {{ .Values.ports.fileUploader }}
        envFrom:
        - configMapRef:
            name: {{ include "whispernotes.fullname" . }}-config
        - secretRef:
            name: {{ include "whispernotes.fullname" . }}-secrets
        resources:
          requests:
            memory: {{ .Values.services.fileUploader.resources.requests.memory }}
            cpu: {{ .Values.services.fileUploader.resources.requests.cpu }}
          limits:
            memory: {{ .Values.services.fileUploader.resources.limits.memory }}
            cpu: {{ .Values.services.fileUploader.resources.limits.cpu }}
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.ports.fileUploader }}
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.ports.fileUploader }}
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "whispernotes.fullname" . }}-file-uploader
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "whispernotes.labels" . | nindent 4 }}
    app.kubernetes.io/component: file-uploader
spec:
  selector:
    {{- include "whispernotes.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: file-uploader
  ports:
  - port: {{ .Values.ports.fileUploader }}
    targetPort: {{ .Values.ports.fileUploader }}
  type: ClusterIP
{{- end }}