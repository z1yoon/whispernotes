{{- if .Values.services.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "whispernotes.fullname" . }}-frontend
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "whispernotes.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.services.frontend.replicas }}
  selector:
    matchLabels:
      {{- include "whispernotes.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "whispernotes.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      containers:
      - name: frontend
        image: {{ .Values.global.imageRegistry }}/{{ .Values.services.frontend.image }}
        ports:
        - containerPort: {{ .Values.ports.frontend }}
        env:
        - name: NEXT_PUBLIC_API_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: {{ include "whispernotes.fullname" . }}-config
              key: NEXT_PUBLIC_API_BASE_URL
        - name: NEXT_PUBLIC_AUTH_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: {{ include "whispernotes.fullname" . }}-config
              key: NEXT_PUBLIC_AUTH_SERVICE_URL
        - name: NEXT_PUBLIC_FILE_UPLOADER_URL
          valueFrom:
            configMapKeyRef:
              name: {{ include "whispernotes.fullname" . }}-config
              key: NEXT_PUBLIC_FILE_UPLOADER_URL
        - name: NEXT_PUBLIC_VIDEO_PROCESSOR_URL
          valueFrom:
            configMapKeyRef:
              name: {{ include "whispernotes.fullname" . }}-config
              key: NEXT_PUBLIC_VIDEO_PROCESSOR_URL
        - name: NODE_ENV
          value: "production"
        resources:
          requests:
            memory: {{ .Values.services.frontend.resources.requests.memory }}
            cpu: {{ .Values.services.frontend.resources.requests.cpu }}
          limits:
            memory: {{ .Values.services.frontend.resources.limits.memory }}
            cpu: {{ .Values.services.frontend.resources.limits.cpu }}
        readinessProbe:
          httpGet:
            path: /
            port: {{ .Values.ports.frontend }}
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: {{ .Values.ports.frontend }}
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "whispernotes.fullname" . }}-frontend
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "whispernotes.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  selector:
    {{- include "whispernotes.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  ports:
  - port: {{ .Values.ports.frontend }}
    targetPort: {{ .Values.ports.frontend }}
  type: ClusterIP
{{- end }}