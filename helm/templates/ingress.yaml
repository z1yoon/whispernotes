apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "whispernotes.fullname" . }}-ingress
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "whispernotes.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  {{- if .Values.ingress.tls.enabled }}
  tls:
  - hosts:
    - {{ .Values.ingress.host }}
    secretName: {{ .Values.ingress.tls.secretName | default (printf "%s-tls" (include "whispernotes.fullname" .)) }}
  {{- end }}
  rules:
  - host: {{ .Values.ingress.host }}
    http:
      paths:
      # Frontend (default route)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ include "whispernotes.fullname" . }}-frontend
            port:
              number: {{ .Values.ports.frontend }}
      
      # API routes
      
      # NextAuth.js authentication routes (handled by Next.js frontend)
      # These handle: /api/auth/signin, /api/auth/signout, /api/auth/session, etc.
      - path: /api/auth(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: {{ include "whispernotes.fullname" . }}-frontend
            port:
              number: {{ .Values.ports.frontend }}
      
      # Backend auth service API routes (FastAPI microservice)
      # These handle: /api/v1/auth/login, /api/v1/auth/me, /api/v1/admin/*, etc.
      - path: /api/v1/auth(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: {{ include "whispernotes.fullname" . }}-auth-service
            port:
              number: {{ .Values.ports.authService }}
      
      - path: /api/upload(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: {{ include "whispernotes.fullname" . }}-file-uploader
            port:
              number: {{ .Values.ports.fileUploader }}
      
      - path: /api/process(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: {{ include "whispernotes.fullname" . }}-video-processor
            port:
              number: {{ .Values.ports.videoProcessor }}
      
      - path: /api/transcribe(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: {{ include "whispernotes.fullname" . }}-whisperx
            port:
              number: {{ .Values.ports.whisperx }}
      
      - path: /api/llm(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: {{ include "whispernotes.fullname" . }}-llm-service
            port:
              number: {{ .Values.ports.llmService }}
      
      {{- if .Values.ingress.paths.rabbitmq.enabled }}
      # RabbitMQ Management (admin interface)  
      - path: /rabbitmq
        pathType: Prefix
        backend:
          service:
            name: {{ include "whispernotes.fullname" . }}-rabbitmq
            port:
              number: {{ .Values.ports.rabbitmqManagement }}
      {{- end }}