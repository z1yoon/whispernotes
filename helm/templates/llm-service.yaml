{{- if .Values.services.llmService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "whispernotes.fullname" . }}-llm-service
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "whispernotes.labels" . | nindent 4 }}
    app.kubernetes.io/component: llm-service
spec:
  replicas: {{ .Values.services.llmService.replicas }}
  selector:
    matchLabels:
      {{- include "whispernotes.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: llm-service
  template:
    metadata:
      labels:
        {{- include "whispernotes.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: llm-service
    spec:
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      containers:
      - name: llm-service
        image: {{ .Values.global.imageRegistry }}/{{ .Values.services.llmService.image }}
        ports:
        - containerPort: {{ .Values.ports.llmService }}
        env:
        - name: QWEN_API_BASE
          valueFrom:
            configMapKeyRef:
              name: {{ include "whispernotes.fullname" . }}-config
              key: QWEN_API_BASE
        - name: QWEN_MODEL
          valueFrom:
            configMapKeyRef:
              name: {{ include "whispernotes.fullname" . }}-config
              key: QWEN_MODEL
        - name: QWEN_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "whispernotes.fullname" . }}-secrets
              key: QWEN_API_KEY
        - name: RABBITMQ_HOST
          valueFrom:
            configMapKeyRef:
              name: {{ include "whispernotes.fullname" . }}-config
              key: RABBITMQ_HOST
        - name: RABBITMQ_PORT
          valueFrom:
            configMapKeyRef:
              name: {{ include "whispernotes.fullname" . }}-config
              key: RABBITMQ_PORT
        - name: RABBITMQ_DEFAULT_USER
          valueFrom:
            configMapKeyRef:
              name: {{ include "whispernotes.fullname" . }}-config
              key: RABBITMQ_DEFAULT_USER
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef:
              name: {{ include "whispernotes.fullname" . }}-secrets
              key: RABBITMQ_DEFAULT_PASS
        - name: MINIO_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: {{ include "whispernotes.fullname" . }}-config
              key: MINIO_ENDPOINT
        - name: MINIO_ACCESS_KEY
          valueFrom:
            configMapKeyRef:
              name: {{ include "whispernotes.fullname" . }}-config
              key: MINIO_ACCESS_KEY
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "whispernotes.fullname" . }}-secrets
              key: MINIO_SECRET_KEY
        - name: MINIO_BUCKET
          valueFrom:
            configMapKeyRef:
              name: {{ include "whispernotes.fullname" . }}-config
              key: MINIO_BUCKET
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: {{ include "whispernotes.fullname" . }}-config
              key: LOG_LEVEL
        resources:
          requests:
            memory: {{ .Values.services.llmService.resources.requests.memory }}
            cpu: {{ .Values.services.llmService.resources.requests.cpu }}
          limits:
            memory: {{ .Values.services.llmService.resources.limits.memory }}
            cpu: {{ .Values.services.llmService.resources.limits.cpu }}
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.ports.llmService }}
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.ports.llmService }}
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "whispernotes.fullname" . }}-llm-service
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "whispernotes.labels" . | nindent 4 }}
    app.kubernetes.io/component: llm-service
spec:
  selector:
    {{- include "whispernotes.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: llm-service
  ports:
  - port: {{ .Values.ports.llmService }}
    targetPort: {{ .Values.ports.llmService }}
  type: ClusterIP
{{- end }}