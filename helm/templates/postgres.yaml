{{- if .Values.services.postgres.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "whispernotes.fullname" . }}-postgres
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "whispernotes.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  replicas: {{ .Values.services.postgres.replicas }}
  selector:
    matchLabels:
      {{- include "whispernotes.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "whispernotes.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      containers:
      - name: postgres
        image: {{ .Values.services.postgres.image }}
        ports:
        - containerPort: {{ .Values.ports.postgres }}
        envFrom:
        - configMapRef:
            name: {{ include "whispernotes.configMapName" . }}
        - secretRef:
            name: {{ include "whispernotes.secretName" . }}
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        - name: init-sql
          mountPath: /docker-entrypoint-initdb.d
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - $(POSTGRES_USER)
            - -d
            - $(POSTGRES_DB)
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - $(POSTGRES_USER)
            - -d
            - $(POSTGRES_DB)
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          {{- toYaml .Values.services.postgres.resources | nindent 10 }}
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: {{ include "whispernotes.fullname" . }}-postgres-pvc
      - name: init-sql
        configMap:
          name: {{ include "whispernotes.fullname" . }}-init-sql
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "whispernotes.fullname" . }}-postgres
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "whispernotes.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  selector:
    {{- include "whispernotes.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  ports:
  - port: {{ .Values.ports.postgres }}
    targetPort: {{ .Values.ports.postgres }}
  type: ClusterIP
{{- end }}