{{- if .Values.services.rabbitmq.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "whispernotes.fullname" . }}-rabbitmq
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "whispernotes.labels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
spec:
  replicas: {{ .Values.services.rabbitmq.replicas }}
  selector:
    matchLabels:
      {{- include "whispernotes.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: rabbitmq
  template:
    metadata:
      labels:
        {{- include "whispernotes.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: rabbitmq
    spec:
      containers:
      - name: rabbitmq
        image: {{ .Values.services.rabbitmq.image }}
        ports:
        - containerPort: {{ .Values.ports.rabbitmq }}
        - containerPort: {{ .Values.ports.rabbitmqManagement }}
        envFrom:
        - configMapRef:
            name: {{ include "whispernotes.configMapName" . }}
        - secretRef:
            name: {{ include "whispernotes.secretName" . }}
        volumeMounts:
        - name: rabbitmq-storage
          mountPath: /var/lib/rabbitmq
        livenessProbe:
          exec:
            command:
            - rabbitmq-diagnostics
            - -q
            - ping
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          exec:
            command:
            - rabbitmq-diagnostics
            - -q
            - check_port_connectivity
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          {{- toYaml .Values.services.rabbitmq.resources | nindent 10 }}
      volumes:
      - name: rabbitmq-storage
        persistentVolumeClaim:
          claimName: {{ include "whispernotes.fullname" . }}-rabbitmq-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "whispernotes.fullname" . }}-rabbitmq
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "whispernotes.labels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
spec:
  selector:
    {{- include "whispernotes.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: rabbitmq
  ports:
  - name: amqp
    port: {{ .Values.ports.rabbitmq }}
    targetPort: {{ .Values.ports.rabbitmq }}
  - name: management
    port: {{ .Values.ports.rabbitmqManagement }}
    targetPort: {{ .Values.ports.rabbitmqManagement }}
  type: ClusterIP
{{- end }}