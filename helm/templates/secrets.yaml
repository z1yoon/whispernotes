apiVersion: v1
kind: Secret
metadata:
  name: {{ include "whispernotes.fullname" . }}-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "whispernotes.labels" . | nindent 4 }}
type: Opaque
data:
  # Database
  POSTGRES_PASSWORD: {{ (env "POSTGRES_PASSWORD") | b64enc | quote }}
  
  # Redis
  REDIS_PASSWORD: {{ (env "REDIS_PASSWORD") | b64enc | quote }}
  
  # RabbitMQ
  RABBITMQ_DEFAULT_PASS: {{ (env "RABBITMQ_DEFAULT_PASS") | b64enc | quote }}
  
  # MinIO
  MINIO_SECRET_KEY: {{ (env "MINIO_SECRET_KEY") | b64enc | quote }}
  
  # JWT
  JWT_SECRET_KEY: {{ (env "JWT_SECRET_KEY") | b64enc | quote }}
  
  # LLM API Keys
  QWEN_API_KEY: {{ (env "QWEN_API_KEY") | b64enc | quote }}
  
  # HuggingFace
  HF_TOKEN: {{ (env "HF_TOKEN") | b64enc | quote }}