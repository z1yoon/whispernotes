apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "whispernotes.fullname" . }}-pv
  labels:
    {{- include "whispernotes.labels" . | nindent 4 }}
spec:
  capacity:
    storage: {{ .Values.storage.pv.size }}
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: {{ .Values.storage.storageClass }}
  hostPath:
    path: {{ .Values.storage.pv.hostPath }}
    type: DirectoryOrCreate
---
# PostgreSQL PVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "whispernotes.fullname" . }}-postgres-pvc
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "whispernotes.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.storage.postgres.size }}
  storageClassName: {{ .Values.storage.storageClass }}
