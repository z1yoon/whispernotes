{{- if .Values.services.whisperx.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "whispernotes.fullname" . }}-whisperx
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "whispernotes.labels" . | nindent 4 }}
    app.kubernetes.io/component: whisperx
spec:
  replicas: {{ .Values.services.whisperx.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "whispernotes.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: whisperx
  template:
    metadata:
      labels:
        {{- include "whispernotes.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: whisperx
    spec:
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      containers:
      - name: whisperx
        image: {{ .Values.global.imageRegistry }}/{{ .Values.services.whisperx.image }}
        ports:
        - containerPort: {{ .Values.ports.whisperx }}
        env:
        - name: REDIS_URL
          value: "redis://:$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)"
        envFrom:
        - configMapRef:
            name: {{ include "whispernotes.configMapName" . }}
        - secretRef:
            name: {{ include "whispernotes.secretName" . }}
        volumeMounts:
        - name: whisperx-storage
          mountPath: /app/models
        - name: huggingface-cache
          mountPath: /root/.cache/huggingface
        - name: temp-storage
          mountPath: /tmp/whisper_temp
        resources:
          requests:
            memory: {{ .Values.services.whisperx.resources.requests.memory }}
            cpu: {{ .Values.services.whisperx.resources.requests.cpu }}
            {{- if .Values.services.whisperx.gpu.enabled }}
            nvidia.com/gpu: {{ .Values.services.whisperx.gpu.count }}
            {{- end }}
          limits:
            memory: {{ .Values.services.whisperx.resources.limits.memory }}
            cpu: {{ .Values.services.whisperx.resources.limits.cpu }}
            {{- if .Values.services.whisperx.gpu.enabled }}
            nvidia.com/gpu: {{ .Values.services.whisperx.gpu.count }}
            {{- end }}
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.ports.whisperx }}
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 15
          failureThreshold: 5
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.ports.whisperx }}
          initialDelaySeconds: 120
          periodSeconds: 60
          timeoutSeconds: 30
          failureThreshold: 5
      volumes:
      - name: whisperx-storage
        persistentVolumeClaim:
          claimName: {{ include "whispernotes.fullname" . }}-whisperx-pvc
      - name: huggingface-cache
        persistentVolumeClaim:
          claimName: {{ include "whispernotes.fullname" . }}-huggingface-cache-pvc
      - name: temp-storage
        emptyDir:
          sizeLimit: 5Gi
      {{- if .Values.services.whisperx.gpu.enabled }}
      {{- if .Values.services.whisperx.gpu.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.services.whisperx.gpu.nodeSelector | nindent 8 }}
      {{- end }}
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "whispernotes.fullname" . }}-whisperx
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "whispernotes.labels" . | nindent 4 }}
    app.kubernetes.io/component: whisperx
spec:
  selector:
    {{- include "whispernotes.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: whisperx
  ports:
  - port: {{ .Values.ports.whisperx }}
    targetPort: {{ .Values.ports.whisperx }}
  type: ClusterIP
{{- end }}