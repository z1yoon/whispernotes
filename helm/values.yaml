# Default values for whispernotes
# This is a YAML-formatted file.
global:
  namespace: whispernotes
  environment: main
  imageRegistry: harbor.leeseng.net/whispernotes
  imagePullPolicy: Always
  imagePullSecrets:
    - name: harbor-credentials

# Storage configuration
storage:
  storageClass: microk8s-hostpath
  pv:
    size: 100Gi
    hostPath: /var/lib/whispernotes
  postgres:
    size: 10Gi
  minio:
    size: 50Gi
  redis:
    size: 5Gi
  rabbitmq:
    size: 5Gi
  whisperx:
    size: 20Gi
  huggingfaceCache:
    size: 10Gi

# Application configuration
config:
  database:
    name: whisper_notes
    user: whisper_user
  redis:
    port: 6379
  rabbitmq:
    port: 5672
    user: whisper_user
    vhost: "/"
  minio:
    # Use existing MinIO credentials
    host: minio.minio.svc.cluster.local
    port: 9000
    accessKey: whisper_admin
    bucket: whispernotes  # Create this bucket in existing MinIO
    externalHost: minio.leeseng.net
  qwen:
    apiBase: https://test-llm.rdc.nie.edu.sg/api/v1/
    model: DeepSeek-R1-Distill-Qwen-32B
  auth:
    jwtAlgorithm: HS256
    jwtExpireMinutes: 1800
    adminEmail: jiyoon.kim@nie.edu.sg
    adminUsername: Amber
  whisperx:
    defaultLanguage: en
    minSpeakers: 1
    maxSpeakers: 10
  logLevel: INFO

# Services configuration
services:
  postgres:
    enabled: true
    image: postgres:15-alpine
    replicas: 1
    resources:
      requests:
        memory: 256Mi
        cpu: 250m
      limits:
        memory: 1Gi
        cpu: 1000m
    
  redis:
    enabled: true
    image: redis:7-alpine
    replicas: 1
    resources:
      requests:
        memory: 128Mi
        cpu: 100m
      limits:
        memory: 256Mi
        cpu: 200m
    
  rabbitmq:
    enabled: true
    image: rabbitmq:3-management-alpine
    replicas: 1
    resources:
      requests:
        memory: 256Mi
        cpu: 200m
      limits:
        memory: 512Mi
        cpu: 400m
    
  minio:
    enabled: false  # Use existing MinIO in minio namespace
    external:
      enabled: true
      # Use existing MinIO service in minio namespace
      host: minio.minio.svc.cluster.local
      port: 9000
      console_port: 9001
      ssl: false  # Internal cluster communication
      # External access via minio.leeseng.net
      public_endpoint: minio.leeseng.net
    
  whisperx:
    enabled: true
    image: whisperx:latest
    replicas: 1
    gpu:
      enabled: true
      count: 1
    env:
      device: cuda
      computeType: float16
      batchSize: 8
      shouldMockDiarization: false
    resources:
      requests:
        memory: 6Gi
        cpu: 1500m
      limits:
        memory: 12Gi
        cpu: 3000m
    
  authService:
    enabled: true
    image: auth-service:latest
    replicas: 1
    resources:
      requests:
        memory: 256Mi
        cpu: 200m
      limits:
        memory: 512Mi
        cpu: 400m
    
  fileUploader:
    enabled: true
    image: file-uploader:latest
    replicas: 1
    resources:
      requests:
        memory: 256Mi
        cpu: 200m
      limits:
        memory: 512Mi
        cpu: 400m
    
  videoProcessor:
    enabled: true
    image: video-processor:latest
    replicas: 1
    resources:
      requests:
        memory: 512Mi
        cpu: 400m
      limits:
        memory: 1Gi
        cpu: 800m
    
  llmService:
    enabled: true
    image: llm-service:latest
    replicas: 1
    resources:
      requests:
        memory: 256Mi
        cpu: 200m
      limits:
        memory: 512Mi
        cpu: 400m
    
  frontend:
    enabled: true
    image: frontend:latest
    replicas: 1
    resources:
      requests:
        memory: 128Mi
        cpu: 100m
      limits:
        memory: 256Mi
        cpu: 200m

# Ingress configuration
ingress:
  enabled: true
  className: nginx
  host: whispernotes.leeseng.net
  tls:
    enabled: true
    secretName: whispernotes-tls-secret
  # Disable paths that conflict with existing services
  paths:
    minio:
      enabled: false  # Use existing minio.leeseng.net
    rabbitmq:
      enabled: false  # Avoid conflicts with existing setup

# Service ports
ports:
  postgres: 5432
  redis: 6379
  rabbitmq: 5672
  rabbitmqManagement: 15672
  minio: 9000
  minioConsole: 9001
  authService: 8000
  fileUploader: 8002
  videoProcessor: 8001
  whisperx: 8003
  llmService: 8004
  frontend: 3000